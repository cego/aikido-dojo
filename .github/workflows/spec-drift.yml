name: spec-drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-drift

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the spec-drift branch
      pull-requests: write # open or update its PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/tools/specfetch
      - id: check
        run: |
          if git diff --quiet; then
            echo "The published spec is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            if go generate ./internal/catalog 2>"$RUNNER_TEMP/generate.log" &&
              go test ./internal/cli -run TestTreeGolden -update >>"$RUNNER_TEMP/generate.log" 2>&1; then
              echo "generate=ok"
            else
              echo "generate=failed"
            fi
            if go vet ./... >"$RUNNER_TEMP/test.log" 2>&1 && go test ./... >>"$RUNNER_TEMP/test.log" 2>&1; then
              echo "tests=ok"
            else
              echo "tests=failed"
            fi
          } >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE: ${{ steps.check.outputs.generate }}
          TESTS: ${{ steps.check.outputs.tests }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c spec-drift
          git add -A
          git commit -m "chore(spec): update the vendored spec from Aikido's API reference"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/spec-drift
          body="specfetch found changes in Aikido's published API reference.

          - Generating the catalog: ${GENERATE}
          - go vet and go test: ${TESTS}

          GitHub holds ci on a PR this workflow opens until a maintainer approves the run; approve it on the PR to get the required checks. Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$GENERATE" = failed ]; then
            body="${body}

          Generation failed:

          \`\`\`
          $(head -c 3000 "$RUNNER_TEMP/generate.log")
          \`\`\`"
          fi
          # gh pr view also finds a merged PR, and --head matches a fork's branch too, so keep only this repository's open PR.
          pr=$(gh pr list --head spec-drift --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not)) | .[0].number // ""')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --head spec-drift --title "chore(spec): update the vendored spec" --body "$body" --assignee "$GITHUB_ACTOR"
          fi
