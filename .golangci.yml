version: "2"
run:
  build-tags:
    - live
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      # Our own packages already return errors with context (clierr carries code and hint).
      ignore-package-globs:
        - github.com/cego/aikido-dojo/*
  exclusions:
    presets:
      - comments
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
